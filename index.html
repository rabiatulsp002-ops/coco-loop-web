function advance(id){let o=S.orders.find(x=>x.id===id);if(!o)return;o.status=o.status==='Diproses'?'Dikirim':'Selesai';persist();render();toast('Status '+id+' diperbarui menjadi '+o.status)}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});document.querySelector('.nav-label + .nav')?.addEventListener('click',()=>{});$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');$('role').onchange=e=>{role=e.target.value;render()};$('modalClose').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};
$('content').addEventListener('submit',e=>{if(e.target.id==='sourceForm'){e.preventDefault();submitSource(e.target)}if(e.target.id==='regenForm'){e.preventDefault();let fd=new FormData(e.target),m=fd.get('material'),qty=Number(fd.get('qty'));if(!(qty>0)||qty>S.out[m]){toast('Jumlah melebihi stok material tersedia.');return}S.out[m]=Math.round((S.out[m]-qty)*100)/100;let r={id:'CO-'+pad(S.regen.length+1),date:dateNow(),land:fd.get('land').trim(),material:m,qty,co2:qty*EF[m]};S.regen.push(r);persist();render();toast('Distribusi '+r.id+' berhasil dicatat')}});
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.process)processMass(b.dataset.process);if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.buy)openOrder(b.dataset.buy);if(b.dataset.advance)advance(b.dataset.advance);if(b.dataset.waybill)waybill(b.dataset.waybill);if(b.dataset.cert)certificate(b.dataset.cert);if(b.dataset.man){let m=S.man.find(x=>x.id===b.dataset.man);openModal('Manifest '+m.id,`<p><b>${esc(m.farmer)}</b> • ${esc(m.location||'-')} • ${m.date}</p><table style="min-width:0"><tr><th>Komponen</th><th>Jumlah</th></tr>${Object.entries(m.q).map(([k,v])=>`<tr><td>${RAW[k].name}</td><td>${kg(v)}</td></tr>`).join('')}<tr><th>Total</th><th>${kg(sum(m.q))}</th></tr></table><div class="form-actions"><button class="btn" onclick="window.print()">Cetak</button></div>`)}});
$('content').addEventListener('click',e=>{if(e.target.id==='exportData'){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coco-loop-data.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='resetData'){if(confirm('Reset seluruh data simulasi ke kondisi awal?')){S=seed();persist();render();toast('Data simulasi direset')}}});
render();initFirebase();
</script>
</body></html>
